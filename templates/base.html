<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crystal Sports</title>
  <style>
    body { font-family: Arial, sans-serif; background: #07111f; color: #f4f7fb; margin: 0; padding: 0; }
    .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
    nav { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; }
    a { color: #6ee7f9; text-decoration: none; }
    .card { background: #10233b; border: 1px solid #274060; border-radius: 12px; padding: 20px; margin: 16px 0; }
    button, .btn { background: #f59e0b; color: #08101b; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    .pill { display: inline-block; background: #1b3550; padding: 6px 10px; border-radius: 999px; margin-right: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <nav>
      <h1><a href="/">Crystal Sports</a></h1>
      <div>
        <a href="/">Home</a> |
        <a href="/pricing">Pricing</a> |
        <a href="/predictions">Predictions</a>
      </div>
    </nav>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
