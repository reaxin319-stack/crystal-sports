<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crystal Sports</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      color: #f4f7fb;
      min-height: 100vh;
      background: linear-gradient(135deg, rgba(7, 17, 31, 0.9), rgba(7, 17, 31, 0.72)),
                  url("https://images.unsplash.com/photo-1517649763962-0c623066013b?auto=format&fit=crop&w=1600&q=80") center/cover no-repeat fixed;
    }
    .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
    nav { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; }
    a { color: #6ee7f9; text-decoration: none; }
    .card {
      background: rgba(16, 35, 59, 0.9);
      border: 1px solid rgba(39, 64, 96, 0.9);
      border-radius: 12px;
      padding: 20px;
      margin: 16px 0;
      backdrop-filter: blur(6px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
    }
    button, .btn { background: #f59e0b; color: #08101b; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    .pill { display: inline-block; background: rgba(27, 53, 80, 0.9); padding: 6px 10px; border-radius: 999px; margin-right: 8px; }
    .home-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start; }
    .home-main { min-width: 0; }
    .live-feed { background: rgba(16, 35, 59, 0.94); border: 1px solid rgba(39, 64, 96, 0.9); border-radius: 8px; padding: 18px; margin: 16px 0; }
    .live-feed-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid rgba(147, 170, 196, 0.2); }
    .live-feed-header h2, .live-feed-header p { margin: 0; }
    .live-feed-header p, .feed-match-meta, .feed-away-team time, .feed-empty { color: #a9bacd; font-size: 0.82rem; }
    .live-count, .feed-live-status, .feed-upcoming-status { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.04em; }
    .live-count, .feed-live-status { color: #f87171; }
    .feed-upcoming-status { color: #9ab0c7; }
    .feed-match { padding: 14px 0; border-bottom: 1px solid rgba(147, 170, 196, 0.16); }
    .feed-match-meta, .feed-team-line { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .feed-match-meta { margin-bottom: 9px; }
    .feed-team-line { min-width: 0; font-size: 0.9rem; }
    .feed-team-line > span:first-child { overflow-wrap: anywhere; }
    .feed-team-line strong { flex: 0 0 auto; font-variant-numeric: tabular-nums; }
    .feed-versus { color: #8296ad; font-size: 0.78rem; font-weight: 500; }
    .feed-away-team { margin-top: 6px; }
    .feed-away-team time { flex: 0 0 auto; font-variant-numeric: tabular-nums; }
    .feed-empty { margin: 18px 0; }
    .feed-link { display: inline-block; margin-top: 14px; font-weight: 600; }
    .dashboard-summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 16px 0; }
    .dashboard-summary > div { padding: 14px 16px; background: rgba(16, 35, 59, 0.9); border-left: 3px solid #6ee7f9; }
    .dashboard-summary span { display: block; color: #a9bacd; font-size: 0.72rem; font-weight: 700; }
    .dashboard-summary strong { display: block; margin-top: 5px; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
    .results-scroll { overflow-x: auto; }
    .results-table { width: 100%; min-width: 640px; border-collapse: collapse; font-size: 0.9rem; }
    .results-table th, .results-table td { padding: 11px 10px; border-bottom: 1px solid rgba(147, 170, 196, 0.18); text-align: left; }
    .results-table th { color: #a9bacd; font-size: 0.72rem; text-transform: uppercase; }
    .result-badge { font-weight: 700; }
    .result-won { color: #86efac; }
    .result-lost { color: #fca5a5; }
    .result-pending { color: #fcd34d; }
    @media (max-width: 860px) { .home-layout { grid-template-columns: minmax(0, 1fr); gap: 0; } }
  </style>
</head>
<body>
  <div class="container">
    <nav>
      <h1><a href="/">Crystal Sports</a></h1>
      <div>
        <a href="/">Home</a> |
        <a href="/pricing">Pricing</a> |
        <a href="/predictions">Predictions</a>
        {% if session.get('user_id') %}
          | <a href="/dashboard">Dashboard</a> | <a href="/account">Account</a> | <a href="/logout">Sign out</a>
        {% else %}
          | <a href="/login">Sign in</a> | <a href="/register">Register</a> | <a href="/admin-login">Admin Login</a>
        {% endif %}
      </div>
    </nav>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
