{% extends 'base.html' %}

{% block content %}
<div class="card">
  <h2>Reset Password</h2>
  {% if message %}<p style="color:#9ae6b4">{{ message }}</p>{% endif %}
  <form method="post">
    <div>
      <label>Email</label><br>
      <input name="email" type="email" required />
    </div>
    <div style="margin-top:12px">
      <button type="submit">Send reset link</button>
    </div>
  </form>
</div>
{% endblock %}
